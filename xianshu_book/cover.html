<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>故事封面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; overflow: hidden; }

        #cover-container {
            width: 100vw;
            height: 100vh;
            background: url('images/cover/bg.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
        }

        /* 标题图片容器 - 这里实现动画 */
        #title-image {
            width: 80%;
            max-width: 800px;
            margin-bottom: 60px;
            /* 初始状态：隐藏、缩小、旋转 */
            opacity: 0;
            transform: scale(0.5) rotate(-10deg);
            transition: all 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        /* 悬停时标题的微互动 */
        #cover-container:hover #title-image {
            transform: scale(1.03) rotate(0deg);
        }
        /* 点击后触发的"飞走"动画 */
        #cover-container.clicked #title-image {
            opacity: 0;
            transform: scale(1.5) translateY(-100px) rotate(10deg);
            transition: all 1s ease-out;
        }

        /* 副标题/提示文字 */
        #subtitle {
            color: black;
            font-size: 1.5em;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            opacity: 0.8;
            /* 呼吸动画 */
            animation: breathe 2s infinite alternate;
        }
        @keyframes breathe {
            from { opacity: 0.6; transform: translateY(0); }
            to { opacity: 1; transform: translateY(-5px); }
        }

        /* 点击后显示的加载条 */
        #loading-bar {
            position: absolute;
            bottom: 20%;
            width: 0%;
            height: 4px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            border-radius: 2px;
            transition: width 1.5s ease;
        }
        #cover-container.clicked #loading-bar {
            width: 70%;
        }
/* 确保音频控制按钮在最上层 */
#global-audio-controls {
    z-index: 10000 !important;
}
    </style>
</head>
<body>
    <div id="cover-container">
        <!-- 你绘制的标题图 -->
        <img id="title-image" src="images/cover/title.png" alt="故事标题">
        <p id="subtitle">点击任意处进入故事世界</p>
        <div id="loading-bar"></div>
    </div>

    <!-- 引入音频管理 -->
    <script src="js/audioManager.js"></script>
 <!-- 在cover.html的script部分 -->
<script>
// 页面加载完成后初始化音频
window.addEventListener('DOMContentLoaded', function() {
    // 初始化音频管理器
    if (window.AudioManager) {
        AudioManager.init();
    } else {
        console.error('AudioManager not found');
    }
});

const cover = document.getElementById('cover-container');
let hasClicked = false;

cover.addEventListener('click', function() {
    if (hasClicked) return; // 防止重复点击
    hasClicked = true;

    // 1. 播放点击音效
    if (window.AudioManager) {
        AudioManager.playSound(AudioManager.SOUNDS.PAGE_TURN);
    }

    // 2. 添加触发动画的类名
    this.classList.add('clicked');

    // 3. 动画播放1.5秒后跳转到主目录页
    setTimeout(() => {
        // 设置标记，表示用户已从封面页进入
        sessionStorage.setItem('hasEnteredFromCover', 'true');
        window.location.href = 'index.html'; // 跳转到你的主目录UI
    }, 1500);
});
</script>
</body>
</html>
